spring.application.name=hijosdelasventas
# Conexión a MySQL: se puede sobrescribir con variables de entorno (DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hijos_ventas}
spring.datasource.username=${DB_USER:hdv}
spring.datasource.password=${DB_PASSWORD:cambiar}
# Crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
