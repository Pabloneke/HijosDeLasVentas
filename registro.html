<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="assets/style.css">
</head>

                    <img src="assets/img/logo.png" alt="Logo" style="height: 55px;">
                </a>
                <!-- Botón hamburguesa: visible solo en pantallas chicas (bootstrap.bundle.min.js lo activa) -->

                        data-bs-target="#navPrincipal" aria-controls="navPrincipal"
                        aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- Contenedor de links: en pantallas grandes se ve entero (y puede pasar a 2 filas si no cabe), -->
                <!-- en pantallas chicas queda oculto hasta tocar el botón hamburguesa -->
                <div class="collapse navbar-collapse flex-grow-0" id="navPrincipal">
                    <div class="d-flex flex-wrap justify-content-center gap-2 py-2">
                        <a class="nav-link" href="index.html">Inicio</a>
                        <a class="nav-link" href="productos.html">Productos</a>
                        <a class="nav-link" href="nosotros.html">Nosotros</a>
                        <a class="nav-link" href="blogs.html">Blogs</a>
                        <a class="nav-link" href="contacto.html">Contacto</a>
                        <a class="nav-link" href="carrito.html">🛒 Carrito</a>
                        <a class="nav-link" href="login.html">Iniciar sesión</a>
                        <a class="nav-link" href="registro.html">Registrarse</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <section class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h2 class="hero-title text-center mb-4">Registro de usuario</h2>

                <!-- Formulario de registro de usuario/cliente -->
                <!-- Reglas de negocio (Anexo 1 - Usuario): ver detalle de cada campo abajo -->
                <form id="registroForm" action="#" method="POST" class="contact-panel" novalidate>

                    <div class="mb-3">
                        <label for="regRun" class="form-label fw-bold">Run (sin puntos ni guion, ej: 19011022K):</label>
                        <input type="text" class="form-control" id="regRun" name="regRun"
                               required minlength="7" maxlength="9" aria-required="true">
                        <span class="error-msg text-danger small" id="error-regRun" aria-live="polite"></span>
                    </div>

                    <div class="mb-3">
                        <label for="regNombre" class="form-label fw-bold">Nombre completo:</label>
                        <input type="text" class="form-control" id="regNombre" name="regNombre"
                               required maxlength="50" aria-required="true">
                        <span class="error-msg text-danger small" id="error-regNombre" aria-live="polite"></span>
                    </div>

                    <div class="mb-3">
                        <label for="regApellidos" class="form-label fw-bold">Apellidos:</label>
                        <input type="text" class="form-control" id="regApellidos" name="regApellidos"
                               required maxlength="100" aria-required="true">
                        <span class="error-msg text-danger small" id="error-regApellidos" aria-live="polite"></span>
                    </div>

                    <div class="mb-3">
                        <label for="regCorreo" class="form-label fw-bold">Correo electrónico:</label>
                        <input type="email" class="form-control" id="regCorreo" name="regCorreo"
                               required maxlength="100"
                               pattern="^[^\s@]+@(duoc\.cl|profesor\.duoc\.cl|gmail\.com)$"
                               title="Solo se aceptan correos @duoc.cl, @profesor.duoc.cl o @gmail.com"
                               aria-required="true">
                        <span class="error-msg text-danger small" id="error-regCorreo" aria-live="polite"></span>
                    </div>

                    <div class="mb-3">
                        <label for="regConfirmarCorreo" class="form-label fw-bold">Confirmar correo:</label>
                        <input type="email" class="form-control" id="regConfirmarCorreo" name="regConfirmarCorreo"
                               required maxlength="100" aria-required="true">
                        <span class="error-msg text-danger small" id="error-regConfirmarCorreo" aria-live="polite"></span>
                    </div>

                    <div class="mb-3">
                        <label for="regPassword" class="form-label fw-bold">Contraseña:</label>
                        <input type="password" class="form-control" id="regPassword" name="regPassword"
                               required minlength="4" maxlength="10" aria-required="true">
                        <span class="error-msg text-danger small" id="error-regPassword" aria-live="polite"></span>
                    </div>

                    <div class="mb-3">
                        <label for="regConfirmarPassword" class="form-label fw-bold">Confirmar contraseña:</label>
                        <input type="password" class="form-control" id="regConfirmarPassword" name="regConfirmarPassword"
                               required minlength="4" maxlength="10" aria-required="true">
                        <span class="error-msg text-danger small" id="error-regConfirmarPassword" aria-live="polite"></span>
                    </div>

                    <div class="mb-3">
                        <label for="regTelefono" class="form-label fw-bold">Teléfono (opcional):</label>
                        <input type="tel" class="form-control" id="regTelefono" name="regTelefono" maxlength="15">
                        <span class="error-msg text-danger small" id="error-regTelefono" aria-live="polite"></span>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="regRegion" class="form-label fw-bold">Región:</label>
                            <select class="form-select" id="regRegion" name="regRegion" required aria-required="true">
                                <option value="" disabled selected>-- Seleccione la región --</option>
                            </select>
                            <span class="error-msg text-danger small" id="error-regRegion" aria-live="polite"></span>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="regComuna" class="form-label fw-bold">Comuna:</label>
                            <select class="form-select" id="regComuna" name="regComuna" required aria-required="true" disabled>
                                <option value="" disabled selected>-- Seleccione la comuna --</option>
                            </select>
                            <span class="error-msg text-danger small" id="error-regComuna" aria-live="polite"></span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="regDireccion" class="form-label fw-bold">Dirección:</label>
                        <input type="text" class="form-control" id="regDireccion" name="regDireccion"
                               required maxlength="300" aria-required="true">
                        <span class="error-msg text-danger small" id="error-regDireccion" aria-live="polite"></span>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold">Registrar</button>
                </form>
            </div>
        </section>
    </main>

    <script src="auth.js"></script>

    <script src="funciones.js"></script>
</body>
</html>
