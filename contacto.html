<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Lo quieres, te lo vendo</title>
    <!-- Bootstrap 5.3.3 vía CDN para estilos base -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos personalizada del proyecto -->
    <link rel="stylesheet" href="assets/style.css"> 
</head>
<body class="bg-light">
    <header>
        <!-- Barra de navegación principal, enlaza a las 4 páginas del sitio -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary justify-content-center">
            <img src="assets/img/logo.png" alt="Logo" class="navbar-brand position-absolute start-0 top-50 translate-middle-y me-3" style="height: 80px;">
            <a class="nav-link text-white fw-bold mx-3" href="index.html">Inicio</a>
            <a class="nav-link text-white fw-bold mx-3" href="contacto.html">Contacto</a>
            <a class="nav-link text-white fw-bold mx-3" href="productos.html">Productos</a>
            <a class="nav-link text-white fw-bold mx-3" href="estadistica.html">Estadisticas</a>
        </nav>  
    </header>

    <main class="container my-5">
        <section class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- Sección de encabezado / hero de la página de contacto -->
                <section class="contact-hero text-center">
                    <div class="hero-badge">Tu pedido, en buenas manos</div>
                    <h2 class="hero-title" style="font-size: clamp(2rem, 3vw, 3rem); margin-bottom: 0;">Contáctanos para tu pedido</h2>
                </section>

                <!-- Resumen del carrito de compras, se llena dinámicamente con JS (funciones.js) -->
                <div class="cart-summary mb-4">
                    <h5 class="mb-3">Resumen de compra</h5>
                    <!-- Contenedor donde se inyectan los productos agregados al carrito -->
                    <div id="contactCartItems" class="cart-items">
                        <p class="text-muted mb-0">Aún no has agregado productos.</p>
                    </div>
                    <!-- Total calculado dinámicamente a partir de los productos del carrito -->
                    <div class="d-flex justify-content-between align-items-center mt-3 border-top pt-3">
                        <span class="fw-bold">Total</span>
                        <span class="cart-total" id="contactCartTotal">$0</span>
                    </div>
                </div>
                
                <!-- Formulario de contacto / confirmación de pedido -->
                <!-- action="#" indica que el envío se maneja vía JavaScript, no hay backend definido -->
               <form id="contactForm" action="#" method="POST" class="contact-panel">

                    <!-- Campo: Nombre completo -->
                    <!-- Validación: mínimo 3 caracteres, solo letras y espacios (incluye tildes y ñ) -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-bold">Nombre completo:</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required minlength="3" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo letras y espacios" aria-required="true">
                        <span class="error-msg text-danger small" id="error-nombre" aria-live="polite"></span>
                    </div>
                    
                    <!-- Campo: Correo electrónico -->
                    <!-- Validación: tipo "email" del navegador + requerido -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Correo electrónico:</label>
                        <input type="email" class="form-control" id="email" name="email" required aria-required="true">
                        <span class="error-msg text-danger small" id="error-email" aria-live="polite"></span>
                    </div>

                    <!-- Campo: Método de pago -->
                    <!-- Select con 4 opciones: transferencia, efectivo, tarjeta/WebPay, MercadoPago -->
                    <div class="mb-3">
                        <label for="metodo-pago" class="form-label fw-bold">Método de pago:</label>
                        <select class="form-select" id="metodo-pago" name="metodo-pago" required aria-required="true">
                            <option value="" disabled selected>Selecciona un método</option>
                            <option value="transferencia">Transferencia bancaria</option>
                            <option value="efectivo">Efectivo / retiro</option>
                            <option value="tarjeta">Tarjeta / WebPay</option>
                            <option value="mercadopago">MercadoPago</option>
                        </select>
                        <span class="error-msg text-danger small" id="error-metodo" aria-live="polite"></span>
                    </div>

                    <!-- Campo: Tipo de entrega -->
                    <!-- Select con 2 opciones: envío a domicilio o retiro en tienda -->
                    <div class="mb-3">
                        <label for="tipo-entrega" class="form-label fw-bold">Tipo de entrega:</label>
                        <select class="form-select" id="tipo-entrega" name="tipo-entrega" required aria-required="true">
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="envio">Envío a domicilio</option>
                            <option value="retiro">Retiro en tienda</option>
                        </select>
                        <span class="error-msg text-danger small" id="error-entrega" aria-live="polite"></span>
                    </div>

                    <!-- Campo: Detalle de la compra (opcional, sin "required") -->
                    <!-- Se usa para dirección, referencias o comentarios adicionales -->
                    <div class="mb-3">
                        <label for="mensaje" class="form-label fw-bold">Detalle de la compra:</label>
                        <textarea class="form-control" id="mensaje" name="mensaje" rows="4" aria-required="true" placeholder="Escribe una referencia, dirección o comentario de la compra..."></textarea>
                        <span class="error-msg text-danger small" id="error-mensaje" aria-live="polite"></span>
                    </div>
                    
                    <!-- Botón de envío del formulario -->
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Confirmar compra</button>
                </form>
            </div>
        </section>
    </main>

    <!-- Pie de página con créditos del equipo de desarrollo -->
    <footer>
        <p class="mb-0">Equipo de Desarrollo - 2026</p>
        <p class="mb-0">| Paulo Catalan | Mauricio Ahumada | Branco Aliaga | Alexander Arancibia | </p>
        <p class="mb-0">Todos los derechos reservados &copy; 2026</p>
        
    </footer>

    <!-- Script con la lógica del carrito, validaciones y envío del formulario -->
    <script src="funciones.js"></script>

</body>
</html>
