<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del producto - Hijos de las Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-light">
    <header>
        <!-- Barra de navegación principal, enlaza a todas las páginas públicas del sitio -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid flex-wrap justify-content-center justify-content-lg-start gap-2">
                <a class="navbar-brand py-0" href="index.html">
                    <img src="assets/img/logo.png" alt="Logo" style="height: 55px;">
                </a>
                <!-- Botón hamburguesa: visible solo en pantallas chicas (bootstrap.bundle.min.js lo activa) -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navPrincipal" aria-controls="navPrincipal"
                        aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- Contenedor de links: en pantallas grandes se ve entero (y puede pasar a 2 filas si no cabe), -->
                <!-- en pantallas chicas queda oculto hasta tocar el botón hamburguesa -->
                <div class="collapse navbar-collapse flex-grow-0" id="navPrincipal">
                    <div class="d-flex flex-wrap justify-content-center gap-2 py-2">
                        <a class="nav-link" href="index.html">Inicio</a>
                        <a class="nav-link" href="productos.html">Productos</a>
                        <a class="nav-link" href="nosotros.html">Nosotros</a>
                        <a class="nav-link" href="blogs.html">Blogs</a>
                        <a class="nav-link" href="contacto.html">Contacto</a>
                        <a class="nav-link" href="carrito.html">🛒 Carrito</a>
                        <a class="nav-link" href="login.html">Iniciar sesión</a>
                        <a class="nav-link" href="registro.html">Registrarse</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <nav aria-label="breadcrumb" class="mb-3 small">
            <a href="index.html">Home</a> &gt; <a href="productos.html">Productos</a> &gt; <span id="detalleBreadcrumbNombre">Producto</span>
        </nav>

        <!-- Todo este bloque se llena dinámicamente según el producto elegido en productos.html -->
        <!-- (ver renderDetalleProducto() en funciones.js, que lee el código desde la URL ?codigo=...) -->
        <section class="row g-4">
            <div class="col-md-6">
                <img id="detalleImagen" src="assets/img/logo.png" alt="" class="img-fluid rounded shadow-sm">
            </div>
            <div class="col-md-6">
                <div class="d-flex justify-content-between align-items-start">
                    <h2 id="detalleNombre">Cargando...</h2>
                    <h3 class="text-primary fw-bold" id="detallePrecio">$0</h3>
                </div>
                <p class="text-muted" id="detalleDescripcion" style="font-size: 14px; line-height: 1.6;"></p>

                <div class="mb-3">
                    <label for="cantidadProducto" class="form-label fw-bold">Cantidad:</label>
                    <select class="form-select" id="cantidadProducto" style="max-width: 120px;">
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <!-- data-name y data-price se completan dinámicamente en renderDetalleProducto() -->
                <button type="button" class="btn btn-primary btn-lg fw-bold" id="btnAgregarDetalleProducto"
                        data-name="" data-price="">
                    Añadir al carrito
                </button>
            </div>
        </section>

        <section class="mt-5">
            <h4>Productos relacionados</h4>
            <!-- Se llena con el resto del catálogo (todos menos el producto que se está viendo) -->
            <div class="row g-3" id="detalleProductosRelacionados"></div>
        </section>
    </main>
    <!-- Pie de página con créditos del equipo de desarrollo -->
    <footer>
        <p class="mb-0">Equipo de Desarrollo - 2026</p>
        <p class="mb-0">| Paulo Catalan | Mauricio Ahumada | Branco Aliaga | Alexander Arancibia | </p>
        <p class="mb-0">Todos los derechos reservados &copy; 2026</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script src="funciones.js"></script>
</body>
</html>
